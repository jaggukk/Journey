<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="A monochrome study of a pale sun over a quiet coast">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e9e7"/>
      <stop offset="0.52" stop-color="#cfcfcd"/>
      <stop offset="1" stop-color="#a9aaa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbfbf8" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#f4f4f0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f4f4f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777875"/>
      <stop offset="0.25" stop-color="#4b4c4a"/>
      <stop offset="1" stop-color="#141515"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="far" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="near" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

  <circle cx="820" cy="248" r="260" fill="url(#glow)"/>
  <circle cx="820" cy="248" r="84" fill="#f4f4ef" opacity="0.72"/>

  <g filter="url(#far)" opacity="0.62">
    <path d="M0 430 110 374l78 24 96-92 88 88 86-30 92 62 98-40 112 60 88-52 128 54 92-26 112 42v186H0Z" fill="#b9bab7"/>
    <path d="M0 474 132 428l86 30 112-58 98 52 78-18 110 46 104-36 126 44 96-22 150 52v162H0Z" fill="#9d9e9b"/>
  </g>

  <path d="M0 512 88 470l92 28 90-50 86 52 122-28 110 44 92-24 132 40 82-18 106 28 100-14v166H0Z" fill="#7b7c79" opacity="0.94"/>

  <path d="M0 548 96 516l84 24 94-32 88 40 116-20 106 34 98-18 126 30 92-14 108 22 92-10v132H0Z" fill="#525350"/>

  <rect y="560" width="1200" height="240" fill="url(#water)"/>

  <g stroke="#d6d6d1" stroke-linecap="round" opacity="0.38">
    <path d="M742 586h156" stroke-width="1.2"/>
    <path d="M792 610h92" stroke-width="1"/>
    <path d="M766 636h122" stroke-width="0.9"/>
    <path d="M806 668h74" stroke-width="0.8"/>
    <path d="M760 706h104" stroke-width="0.7"/>
    <path d="M826 736h48" stroke-width="0.6"/>
  </g>

  <g stroke="#b7b8b3" stroke-linecap="round" opacity="0.16">
    <path d="M0 602h336" stroke-width="1"/>
    <path d="M64 628h246" stroke-width="0.9"/>
    <path d="M18 658h308" stroke-width="0.8"/>
    <path d="M112 690h198" stroke-width="0.7"/>
    <path d="M0 724h352" stroke-width="0.6"/>
    <path d="M58 756h242" stroke-width="0.5"/>
    <path d="M874 620h286" stroke-width="0.8"/>
    <path d="M936 650h224" stroke-width="0.7"/>
    <path d="M894 684h260" stroke-width="0.6"/>
    <path d="M960 722h190" stroke-width="0.5"/>
  </g>

  <g fill="#0b0c0c">
    <path d="M0 560h256l26 18 18-6 16 10 22-2 24 14H0Z" opacity="0.9"/>
    <path d="M1030 560h170v32h-96l-18-12-22 4-14-10Z" opacity="0.84"/>
  </g>

  <g filter="url(#near)" opacity="0.3">
    <path d="M74 800c28-92 74-158 146-214 24-18 48-42 66-68 3 34-4 62-14 90 48-18 74-46 94-82 6 52-10 92-34 126 46-14 78-40 104-74 0 54-22 94-54 126 50-10 88-30 122-62-12 50-44 88-90 120-30 22-54 48-70 84Z" fill="#090a0a"/>
    <path d="M950 800c-12-74-54-132-118-178-22-16-40-34-54-54 4 28 12 48 26 66-38-12-62-34-78-62 0 42 14 72 36 98-42-10-70-30-92-54 4 44 24 78 54 104-48-4-84-18-116-42 20 40 52 70 96 92 16 10 28 20 36 30Z" fill="#0d0e0e"/>
  </g>

  <rect width="1200" height="800" fill="url(#vignette)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.55"/>
</svg>
